version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sst_hslv_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SstHslv2024!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sst_sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  sst_sqldata:
    driver: local